name: l4kdev-sale-dashboard
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ./env/backend.env
    environment:
      NODE_ENV: production
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:4000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      - internal

networks:
  internal:
    driver: bridge
